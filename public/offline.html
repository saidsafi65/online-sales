<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال بالإنترنت</title>
<style>
  body {
    font-family: 'Tajawal', 'Cairo', system-ui, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .box { max-width: 380px; }
  .icon { font-size: 3.5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; font-weight: 800; margin: 0 0 0.5rem; }
  p { color: #64748b; font-size: 0.95rem; margin: 0 0 1.5rem; }
  button {
    background: #dc2626; color: white; border: none; border-radius: 10px;
    padding: 0.75rem 1.5rem; font-weight: 700; font-size: 0.95rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالإنترنت وحاول مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
